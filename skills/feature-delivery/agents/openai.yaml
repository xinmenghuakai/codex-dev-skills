interface:
  display_name: "研发交付流程"
  short_description: "按轻量行为修复、简单修复、整体实现或分模块模式编排研发交付"
  default_prompt: "使用 $feature-delivery 推进研发交付；先基于真实代码判断是否符合轻量行为修复（稳定既有接口仅改查询/排序/分页等），否则再选择简单修复、整体实现（默认）或分模块实现。轻量行为修复和简单修复由当前主 Agent 完成最小实现、必要定向验证和短 diff 核对，不进入正式 Gate；整体和分模块模式按风险审查，正式 Gate 仅用于规定的发布场景，分模块时按依赖选择串行或最多 3 路分波次并行。"
